# grafana/grafana.ini
# Este arquivo é montado em /etc/grafana/grafana.ini dentro do contêiner

[paths]
# Defina explicitamente os caminhos de dados e provisionamento
# Isso substitui as variáveis de ambiente GF_PATHS_...
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[security]
# Defina as credenciais de administrador (opcional, pode ser via env_vars)
admin_user = admin
admin_password = admin

[server]
http_port = 3000

# Seções de provisionamento
# O Grafana automaticamente procura por subpastas (datasources, dashboards) dentro de 'provisioning'
[provisioning]
# Por padrão, ele verifica se a pasta de provisionamento existe.
# Não precisamos de configurações adicionais aqui, apenas garantir que o caminho esteja certo.

# Adicione esta seção para aumentar a verbosidade de logs (já está em debug via env)
[log]
level = debug