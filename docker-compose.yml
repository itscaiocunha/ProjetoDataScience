version: "3"

services:
  gerador-dados:
    build: ./gerador_dados
    volumes:
      - ./data:/data
    container_name: gerador-dados

  analise-r:
    build: ./analise_r
    volumes:
      - ./data:/data
    depends_on:
      - gerador-dados
    container_name: analise-r

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock # Permite que o Jenkins use Docker
    user: root # Permite instalar plugins e usar o socket docker
    restart: unless-stopped

volumes:
  jenkins_home:
